name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The package floor is PHP 8.1 (composer.json). Every version from the floor
    # to current runs the full suite, including the `network-local` group that
    # drives CurlHttpClient against PHP's built-in server.
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: curl, json, mbstring
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-

    # laravel/pint ^1.30 needs PHP >= 8.2; it only has to run once, on the
    # newest PHP, so the 8.1 cell drops it rather than lowering the pin.
    - name: Drop Pint on PHP 8.1
      if: matrix.php-version == '8.1'
      run: composer remove laravel/pint --dev --no-update --no-interaction

    # No composer.lock is committed: each PHP version resolves its own PHPUnit.
    - name: Install dependencies
      run: composer update --no-progress --prefer-dist --no-interaction

    - name: Run tests
      run: vendor/bin/phpunit --colors=never

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --no-progress --error-format=github

    - name: Run Laravel Pint
      if: matrix.php-version == '8.5'
      run: vendor/bin/pint --test
